<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2027" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="メンバー選出" />
  <title>アルティメット メンバー選出アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style_app.css" />
</head>
<body>
  <div class="app-container">
      <div class="app-header">
        <div class="app-icon">U</div>
        <div>
          <div class="app-kicker">ULTIMATE</div>
          <div class="app-subtitle">メンバー選出</div>
        </div>
      </div>
    <h1 class="title">アルティメット メンバー選出</h1>
    <div class="card">
      <h2>メンバー登録</h2>
      <div class="form-row">
        <input type="text" id="nameInput" placeholder="名前" />
        <!-- 主ポジション（最大3つ） -->
        <div class="primary-positions">
          <label><input type="checkbox" class="primary-checkbox" value="hand" /> ハンド</label>
          <label><input type="checkbox" class="primary-checkbox" value="middle" /> ミドル</label>
          <label><input type="checkbox" class="primary-checkbox" value="deep" /> ディープ</label>
        </div>
      </div>
      <div class="extra-positions">
        <label>追加ポジション（最大3つ）:</label><br/>
        <label><input type="checkbox" value="ハメカップ" class="extra-checkbox" /> ハメカップ</label>
        <label><input type="checkbox" value="ショーD" class="extra-checkbox" /> ショーD</label>
        <label><input type="checkbox" value="スト" class="extra-checkbox" /> スト</label>
        <label><input type="checkbox" value="アンハメカップ" class="extra-checkbox" /> アンハメカップ</label>
        <label><input type="checkbox" value="ハメサイミ" class="extra-checkbox" /> ハメサイミ</label>
        <label><input type="checkbox" value="アンハメサイミ" class="extra-checkbox" /> アンハメサイミ</label>
        <label><input type="checkbox" value="DD" class="extra-checkbox" /> DD</label>
      </div>
      <button id="addBtn" class="add-btn">追加</button>
      <div class="member-table-wrapper">
        <table class="member-table">
        <thead>
          <tr>
            <th>除外</th><th>優先</th><th>名前</th><th>主ポジション</th><th>追加ポジション</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="memberList"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>選出</h2>
      <button id="selectBtn" class="select-btn">7人選出</button>
      <div id="result" class="result"></div>
    </div>
  </div>
  <script src="script_app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js");
    });
  }
</script>

</body>
</html>
